<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank to Premier</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <script src="assets/js/script.js" defer></script>
</head>

<body>
    <div class="outer-container">

        <h3 class="title">CS:GO rank to CS2 premier rating equivalents based on 2023 and 2026 percentile data</h3>

        <div class="inner-container">
            <!-- SILVER -->
            <div>
                <h5>Silver</h5>
                <table class="rank-table">
                    <thead>
                        <tr>
                            <th>CS:GO rank</th>
                            <th></th>
                            <th>CS2 premier rating</th>
                        </tr>
                    </thead>

                    <tbody id="tbody-silver"></tbody>
                </table>
            </div>

            <!-- NOVA -->
            <div>
                <h5>Gold Nova</h5>
                <table class="rank-table">
                    <thead>
                        <tr>
                            <th>CS:GO rank</th>
                            <th></th>
                            <th>CS2 premier rating</th>
                        </tr>
                    </thead>

                    <tbody id="tbody-nova"></tbody>
                </table>
            </div>
        </div>

        <div class="inner-container">
            <!-- MG -->
            <div>
                <h5>Master Guardian</h5>
                <table class="rank-table">
                    <thead>
                        <tr>
                            <th>CS:GO rank</th>
                            <th></th>
                            <th>CS2 premier rating</th>
                        </tr>
                    </thead>

                    <tbody id="tbody-mg"></tbody>
                </table>
            </div>

            <!-- EAGLE+ -->
            <div>
                <h5>Eagle & Above</h5>
                <table class="rank-table">
                    <thead>
                        <tr>
                            <th>CS:GO rank</th>
                            <th></th>
                            <th>CS2 premier rating</th>
                        </tr>
                    </thead>

                    <tbody id="tbody-eagle"></tbody>
                    <tbody id="tbody-global"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
